name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::Tidak ada file ZIP di root repository."
            echo "Isi repository:"
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.find_zip.outputs.zip }}"

          rm -rf /tmp/eclipsce-extracted
          mkdir -p /tmp/eclipsce-extracted

          echo "Extracting: $ZIP"

          unzip -q "$ZIP" -d /tmp/eclipsce-extracted

          ROOT="/tmp/eclipsce-extracted"

          # Jika ZIP hanya berisi satu folder utama,
          # gunakan isi folder tersebut sebagai root project.
          ITEMS=$(find "$ROOT" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ]; then
            ONLY=$(find "$ROOT" -mindepth 1 -maxdepth 1 | head -n 1)

            if [ -d "$ONLY" ]; then
              ROOT="$ONLY"
            fi
          fi

          echo "Extract root: $ROOT"

          # Hapus ZIP dari hasil extract jika ada
          find "$ROOT" -type f -iname "*.zip" -delete

          # Copy seluruh isi ZIP langsung ke root repository
          cp -a "$ROOT"/. .

      - name: Remove ZIP
        shell: bash
        run: |
          set -e

          find . -maxdepth 1 -type f -iname "*.zip" -delete

          echo "ZIP berhasil dihapus dari repository."

      - name: Show Result
        shell: bash
        run: |
          echo "=== Struktur repository ==="
          find . -maxdepth 3 \
            -not -path "./.git/*" \
            -not -path "./.github/workflows/*" \
            -print | sort

      - name: Commit Changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract ZIP to repository root"
          git push origin HEAD:main
