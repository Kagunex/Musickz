name: Extract Musickz ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        id: zip
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP tidak ditemukan di root repository."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "ZIP: $ZIP"

      - name: Validate ZIP
        run: |
          unzip -t "${{ steps.zip.outputs.zip }}"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf /tmp/musickz
          mkdir -p /tmp/musickz

          unzip -q "${{ steps.zip.outputs.zip }}" -d /tmp/musickz

          ROOT="/tmp/musickz"

          # Kalau ZIP punya folder pembungkus seperti Metrolist-main/
          COUNT=$(find "$ROOT" -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" -eq 1 ]; then
            ONLY=$(find "$ROOT" -mindepth 1 -maxdepth 1 | head -n 1)

            if [ -d "$ONLY" ]; then
              ROOT="$ONLY"
            fi
          fi

          echo "Project root: $ROOT"

          if [ ! -f "$ROOT/gradlew" ]; then
            echo "::error::gradlew tidak ditemukan."
            exit 1
          fi

          # Hapus .github dari ZIP
          rm -rf "$ROOT/.github"

          # Salin semua isi project ke root repository
          cp -a "$ROOT"/. .

      - name: Remove ZIP
        run: |
          rm -f "${{ steps.zip.outputs.zip }}"

      - name: Verify
        run: |
          set -e

          echo "=== PROJECT ==="

          test -f gradlew
          test -d app

          echo "✓ gradlew"
          echo "✓ app/"

          echo ""
          echo "=== WORKFLOW ==="

          if [ -f ".github/workflows/ekstrak.yml" ]; then
            echo "✓ ekstrak.yml tetap ada"
          else
            echo "::warning::ekstrak.yml tidak ditemukan."
          fi

      - name: Commit and Push
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract Musickz project"

          git push origin HEAD:main
