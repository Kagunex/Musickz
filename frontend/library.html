<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Library · MusicKx</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/search.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        MusicKx
      </div>
      <nav class="sidebar-nav" aria-label="Main">
        <a href="/">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="/search">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Search
        </a>
        <a href="/library" class="active" aria-current="page">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
          Your Library
        </a>
      </nav>
      <div class="sidebar-divider"></div>
      <nav class="sidebar-nav">
        <a href="/library">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          Liked Songs
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <h1 class="page-title" style="margin-bottom:1.25rem">Your Library</h1>
      <div class="lib-tabs" role="tablist">
        <button class="lib-tab active" data-tab="songs" role="tab" aria-selected="true">Songs</button>
        <button class="lib-tab" data-tab="albums" role="tab">Albums</button>
        <button class="lib-tab" data-tab="artists" role="tab">Artists</button>
        <button class="lib-tab" data-tab="playlists" role="tab">Playlists</button>
      </div>
      <div id="lib-content"></div>
    </main>
  </div>

  <div class="mini-player hidden" id="mini-player">
    <div class="mini-progress"></div>
    <div class="mini-art"></div>
    <div class="mini-info"><div class="song-title">—</div><div class="meta-text">—</div></div>
    <div class="mini-controls">
      <button class="btn-icon" data-mini-play data-play-icon aria-label="Play"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      <button class="btn-icon" data-mini-next aria-label="Next"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m5 4 10 8-10 8V4z"/><rect x="17" y="4" width="2" height="16"/></svg></button>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Mobile">
    <a href="/" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Home</a>
    <a href="/search" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Search</a>
    <a href="/library" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg> Library</a>
  </nav>

  <div class="desktop-player" id="desktop-player">
    <div class="dp-left">
      <div class="dp-art"></div>
      <div class="dp-info"><div class="song-title">Not playing</div><div class="meta-text">—</div></div>
    </div>
    <div class="dp-center">
      <div class="dp-controls">
        <button class="btn-icon" data-dp-prev aria-label="Previous"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 20 9 12l10-8v16z"/><rect x="5" y="4" width="2" height="16"/></svg></button>
        <button class="dp-play" data-mini-play data-play-icon aria-label="Play"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
        <button class="btn-icon" data-mini-next aria-label="Next"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="m5 4 10 8-10 8V4z"/><rect x="17" y="4" width="2" height="16"/></svg></button>
      </div>
      <div class="dp-progress-row">
        <span class="dp-time" id="dp-time-cur">0:00</span>
        <div class="progress-bar" id="dp-progress-bar"><div class="progress-fill"></div></div>
        <span class="dp-time" id="dp-time-dur">0:00</span>
      </div>
    </div>
    <div class="dp-right"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
    <script type="module" src="/js/library.js"></script>
</body>
</html>
