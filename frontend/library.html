<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Library · MusicKx</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/search.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <style>
    .lib-tabs { display:flex; gap:0.5rem; margin-bottom:1.25rem; overflow-x:auto; scrollbar-width:none; }
    .lib-tabs::-webkit-scrollbar { display:none; }
    .lib-tab { padding:0.5rem 1rem; border-radius:9999px; font-size:0.875rem; font-weight:500; color:var(--text-secondary); background:var(--bg-elevated); border:1px solid var(--border-subtle); white-space:nowrap; transition:all 0.2s; }
    .lib-tab.active { background:var(--accent); color:#0a0a0b; border-color:transparent; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">MusicKx</div>
      <nav class="sidebar-nav">
        <a href="/"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Home</a>
        <a href="/search"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Search</a>
        <a href="/library" class="active"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg> Library</a>
      </nav>
    </aside>

    <main class="main-content">
      <h1 class="page-title" style="margin-bottom:1.25rem">Library</h1>
      <div class="lib-tabs">
        <button class="lib-tab active" data-tab="songs">Songs</button>
        <button class="lib-tab" data-tab="albums">Albums</button>
        <button class="lib-tab" data-tab="artists">Artists</button>
        <button class="lib-tab" data-tab="playlists">Playlists</button>
      </div>
      <div id="lib-content"></div>
    </main>
  </div>

  <div class="mini-player hidden" id="mini-player">
    <div class="mini-progress"></div>
    <div class="mini-art"></div>
    <div class="mini-info"><div class="song-title">—</div><div class="meta-text">—</div></div>
    <div class="mini-controls">
      <button class="btn-icon" data-mini-play data-play-icon aria-label="Play"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
      <button class="btn-icon" data-mini-next aria-label="Next"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="m5 4 10 8-10 8V4z"/><rect x="17" y="4" width="2" height="16"/></svg></button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Home</a>
    <a href="/search" class="nav-item"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Search</a>
    <a href="/library" class="nav-item active"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg> Library</a>
  </nav>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/library.js"></script>
</body>
</html>
